<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentions légales — Alexy Durand</title>
    <meta
      name="description"
      content="Mentions légales du portfolio d'Alexy Durand : éditeur, hébergeur, crédits et données personnelles."
    />
    <meta name="robots" content="noindex" />
    <!-- Dark by default, unless light was chosen with the header button: applied before the first paint -->
    <script>
      try {
        if (localStorage.getItem('theme') !== 'light')
          document.documentElement.classList.add('dark');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>

    <div id="root"></div>
    <noscript>

        Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis). Aucun cookie,
        aucune mesure d'audience.
      </p>
    </noscript>
    <script type="module" src="/src/legal.tsx"></script>
